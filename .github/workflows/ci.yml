name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: everus}
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-retries=20
    env: {DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, DB_NAME: everus}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: mysql -h127.0.0.1 -uroot -proot everus < schema.sql
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Start app + OWASP ZAP baseline (dynamic security scan)
        run: |
          node src/server.js & sleep 4
          docker run --network host -v $PWD:/zap/wrk ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:3000 -I
